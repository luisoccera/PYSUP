project_id = "pysup"

[api]
max_rows = 500

[auth]
site_url = "http://127.0.0.1:8081"
additional_redirect_urls = ["pysup://auth/callback", "http://127.0.0.1:8081/auth/callback", "https://dominio-produccion.com/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_anonymous_sign_ins = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

[auth.rate_limit]
email_sent = 3
sms_sent = 10
anonymous_users = 1
token_refresh = 150
sign_in_sign_ups = 10
token_verifications = 10

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "2m"
otp_length = 8
otp_expiry = 900

[auth.sessions]
timebox = "168h"
inactivity_timeout = "24h"

[storage]
file_size_limit = "80MiB"

[functions.clip-analysis]
verify_jwt = true

[functions.export-user-data]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.purge-expired-clips]
verify_jwt = false

[functions.push-dispatch]
verify_jwt = false

[functions.catalog-sync]
verify_jwt = false
